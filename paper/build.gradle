plugins {
    id "java"
    id "io.github.goooler.shadow"
}

dependencies {
    implementation project(":core")
    compileOnly "io.papermc.paper:paper-api:${rootProject.releaseProfile.paperApi}"
    shadow project(":core")
}

processResources {
    def metadata = [version: project.version, minecraft_version: rootProject.releaseProfile.minecraftVersion]
    inputs.properties(metadata)
    filesMatching('plugin.yml') {
        expand(metadata) { escapeBackslash = true }
    }
}

base {
    archivesName = "PocketDice-${project.version}-Paper"
}

tasks.withType(Jar).configureEach {
    archiveVersion.set("")
}

assemble.dependsOn shadowJar

shadowJar {
    archiveClassifier.set("") 
}
