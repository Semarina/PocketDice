name: Bug report
description: Report a problem in PocketDice
title: "[BUG] <short summary>"
labels: [bug, needs-triage]
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Steps to reproduce and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PocketDice version
      placeholder: v0.1.0
  - type: dropdown
    id: server
    attributes:
      label: Platform
      options: [Paper 26.3, Purpur 26.3, Folia 26.3, Fabric 26.3, Quilt 26.3, Paper 26.2, Purpur 26.2, Folia 26.2, Fabric 26.2, Quilt 26.2]
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      description: Paste relevant lines.
