# File: .github/workflows/build.yml
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          .\gradlew.bat build '-Prelease_target=26.2' "-Dorg.gradle.java.home=$env:JAVA_HOME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\gradlew.bat build "-Dorg.gradle.java.home=$env:JAVA_HOME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDice-jars
          path: |
            build/libs/PocketDice-0.5.0-*.jar
            build/libs/PocketDice-0.6.0-*.jar
