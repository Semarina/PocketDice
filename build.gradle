plugins {
    id 'java'
    id 'io.github.goooler.shadow' version '8.1.8' apply false
}

subprojects {
    apply plugin: 'java'

    group = 'me.sepehrhn'
    version = '0.3.0'

    repositories {
        mavenCentral()
        maven { url "https://repo.papermc.io/repository/maven-public/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    }

    test {
        useJUnitPlatform()
    }
    
    // java {
    //     toolchain {
    //         languageVersion = JavaLanguageVersion.of(21)
    //     }
    // }

}

tasks.register('copyArtifacts', Copy) {
    dependsOn subprojects.collect { it.tasks.named('assemble') }
    
    doFirst {
        delete layout.buildDirectory.dir('libs')
    }

    from project(':paper').layout.buildDirectory.dir('libs')
    from project(':fabric').layout.buildDirectory.dir('libs')
    include "*-Paper.jar"
    include "*-Fabric.jar"
    into layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

build.finalizedBy(copyArtifacts)

