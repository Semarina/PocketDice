plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "io.github.goooler.shadow"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.1 Loom can publish a resource-only merged jar; compile against the generated class jars.
    def minecraftCache = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${project.minecraft_version}")
    compileOnly files(
        new File(minecraftCache, "minecraft-client.jar"),
        new File(minecraftCache, "minecraft-extracted_server.jar")
    )
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Adventure for Fabric
    implementation "net.kyori:adventure-text-minimessage:4.17.0"
    shadow "net.kyori:adventure-text-minimessage:4.17.0"
    implementation "net.kyori:adventure-text-serializer-gson:4.17.0"
    shadow "net.kyori:adventure-text-serializer-gson:4.17.0"
    // Also include API as it is transitive but needed
    implementation "net.kyori:adventure-api:4.17.0"
    shadow "net.kyori:adventure-api:4.17.0"
    // Adventure Key (transitive, needed)
    implementation "net.kyori:adventure-key:4.17.0"
    shadow "net.kyori:adventure-key:4.17.0"
    // Include transitive examination dependencies explicitly
    implementation "net.kyori:examination-api:1.3.0"
    shadow "net.kyori:examination-api:1.3.0"
    implementation "net.kyori:examination-string:1.3.0"
    shadow "net.kyori:examination-string:1.3.0"
    // Adventure JSON Serializer (transitive of Gson, needed)
    implementation "net.kyori:adventure-text-serializer-json:4.17.0"
    shadow "net.kyori:adventure-text-serializer-json:4.17.0"
    // Adventure Option (transitive of JSON, needed)
    implementation "net.kyori:option:1.0.0"
    shadow "net.kyori:option:1.0.0"

    // YAML configuration library
    implementation "org.yaml:snakeyaml:2.2"
    shadow "org.yaml:snakeyaml:2.2"

    implementation project(":core")
    shadow project(":core")
}

base {
    archivesName = "PocketDice-${project.version}-Fabric"
}

tasks.withType(Jar).configureEach {
    archiveVersion.set("")
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set("")
    archiveFileName.set("PocketDice-${project.version}-Fabric.jar")
    from sourceSets.main.output
}

assemble.dependsOn shadowJar

tasks.withType(JavaCompile).configureEach {
    options.release.set(25)
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
